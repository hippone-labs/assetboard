<!-- The app icon source: full-bleed 1024×1024, no baked mask or shadow (macOS masks it and adds the shadow). desktop/icon-1024.png is
     rendered from it at 1024 px; the site (assets/icon.webp, favicon.svg) and the purchase pages use the same drawing. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2d35"/><stop offset="1" stop-color="#101114"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfbfd"/><stop offset="1" stop-color="#dfe2e8"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9cc0f7"/><stop offset="1" stop-color="#5f93ea"/></linearGradient>
<filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".45"/></filter></defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<radialGradient id="glow" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#7aa9f2" stop-opacity=".22"/><stop offset="1" stop-color="#7aa9f2" stop-opacity="0"/></radialGradient>
<rect width="1024" height="1024" fill="url(#glow)"/>
<g filter="url(#s)">
<rect x="212" y="212" width="340" height="270" rx="54" fill="url(#t)"/>
<rect x="582" y="212" width="230" height="270" rx="54" fill="url(#t)" opacity=".92"/>
<rect x="212" y="512" width="230" height="300" rx="54" fill="url(#t)" opacity=".92"/>
<rect x="472" y="512" width="340" height="300" rx="54" fill="url(#ac)"/>
</g>
<circle cx="790" cy="534" r="46" fill="#f0a64b" stroke="#16171b" stroke-width="16"/>
</svg>
