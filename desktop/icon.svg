<!-- The app icon source: full-bleed 1024×1024, no baked mask or shadow. The whole icon is the board: two seams cut it like clock hands
     at nine (reminders go out at 09:00), the amber due dot is the pivot and the blue tile is the record that is due. desktop/icon-1024.png
     is rendered from it at 1024 px, and tools/app-icon.py makes the Mac app's icon from that (desktop/AppIcon.icon for Assets.car,
     desktop/icon-macos-1024.png for AppIcon.icns); the site (assets/icon.webp, favicon.svg) and the purchase pages use the same drawing. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs><linearGradient id="o" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfcf9"/><stop offset="1" stop-color="#e9e5dd"/></linearGradient><linearGradient id="t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f78da"/><stop offset="1" stop-color="#3558b5"/></linearGradient></defs>
<rect width="1024" height="1024" fill="url(#o)"/>
<rect width="416" height="592" fill="url(#t)"/>
<rect x="384" width="64" height="592" fill="#1c1b19"/><rect y="560" width="416" height="64" fill="#1c1b19"/>
<circle cx="416" cy="592" r="160" fill="#1c1b19"/><circle cx="416" cy="592" r="96" fill="#f0a64b"/>
</svg>
