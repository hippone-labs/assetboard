  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcfbf8"/><stop offset="1" stop-color="#eeeae2"/></linearGradient></defs>
  <rect width="660" height="400" fill="url(#bg)"/>
  <rect x="112" y="122" width="136" height="136" rx="32" fill="#fff" fill-opacity=".55" stroke="#1c1b19" stroke-opacity=".08"/>
  <rect x="412" y="122" width="136" height="136" rx="32" fill="#3b63c4" fill-opacity=".05" stroke="#3b63c4" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="5 6" stroke-linecap="round"/>
