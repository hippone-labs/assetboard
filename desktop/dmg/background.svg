  <rect x="261.5" y="178" width="1" height="8" fill="#1c1b19" opacity="0.38"/><rect x="271.5" y="182" width="1" height="4" fill="#1c1b19" opacity="0.22"/><rect x="281.5" y="182" width="1" height="4" fill="#1c1b19" opacity="0.22"/><rect x="291.5" y="182" width="1" height="4" fill="#1c1b19" opacity="0.22"/><rect x="301.5" y="182" width="1" height="4" fill="#1c1b19" opacity="0.22"/><rect x="311.5" y="178" width="1" height="8" fill="#1c1b19" opacity="0.38"/><rect x="321.5" y="182" width="1" height="4" fill="#1c1b19" opacity="0.22"/><rect x="331.5" y="182" width="1" height="4" fill="#1c1b19" opacity="0.22"/><rect x="341.5" y="182" width="1" height="4" fill="#1c1b19" opacity="0.22"/><rect x="351.5" y="182" width="1" height="4" fill="#1c1b19" opacity="0.22"/><rect x="361.5" y="178" width="1" height="8" fill="#1c1b19" opacity="0.38"/><rect x="371.5" y="182" width="1" height="4" fill="#1c1b19" opacity="0.22"/><rect x="381.5" y="182" width="1" height="4" fill="#1c1b19" opacity="0.22"/><rect x="391.5" y="182" width="1" height="4" fill="#1c1b19" opacity="0.22"/>
  <rect x="262" y="189.25" width="134" height="1.5" rx=".75" fill="#1c1b19" opacity=".22"/>
  <rect x="262" y="188.75" width="58" height="2.5" rx="1.25" fill="#3b63c4"/>
  <circle cx="320" cy="190" r="9" fill="#1c1b19"/><circle cx="320" cy="190" r="5.5" fill="#f0a64b"/>
  <path d="M389 182 L 398 190 L 389 198" fill="none" stroke="#1c1b19" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="330" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', Inter, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#3a3833">拖到 Applications 文件夹即可安装</text>
