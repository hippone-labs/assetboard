# TEMPORARY: diagnostics for the browser tests on GitHub-hosted macOS 26 (removed before merge). No secrets.
name: diag-browser
on:
  push:
    branches: [cc/hosted-mac-tests]
permissions:
  contents: read
jobs:
  diag:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: System settings
        run: |
          sw_vers; sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize || true
          for k in reduceTransparency reduceMotion increaseContrast; do echo "universalaccess $k: $(defaults read com.apple.universalaccess $k 2>&1)"; done
          echo "AppleShowScrollBars: $(defaults read -g AppleShowScrollBars 2>&1)"
          system_profiler SPDisplaysDataType 2>&1 | head -30
      - name: Playwright
        run: |
          pw_home="$RUNNER_TEMP/playwright"
          npm install --prefix "$pw_home" --no-audit --no-fund playwright@1.64.1
          "$pw_home/node_modules/.bin/playwright" install chromium
          echo "NODE_PATH=$pw_home/node_modules" >> "$GITHUB_ENV"
      - name: Diagnostics
        run: node tools/ci-diag.js
      - name: The three tests
        if: ${{ !cancelled() }}
        run: node tools/browser-tests.js --port 4330 tests/detail-card.playwright.js tests/detail-room.playwright.js tests/sidebar-fold.playwright.js
