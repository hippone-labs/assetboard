# TEMPORARY: the browser tests on GitHub-hosted macOS 26, several times over, to find slow-machine flakes (removed before merge). No secrets.
name: diag-browser
on:
  push:
    branches: [cc/hosted-mac-tests]
permissions:
  contents: read
jobs:
  diag:
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Playwright
        run: |
          pw_home="$RUNNER_TEMP/playwright"
          npm install --prefix "$pw_home" --no-audit --no-fund playwright@1.64.1
          "$pw_home/node_modules/.bin/playwright" install chromium
          echo "NODE_PATH=$pw_home/node_modules" >> "$GITHUB_ENV"
      - name: Browser tests
        run: node tools/browser-tests.js --port 4330
