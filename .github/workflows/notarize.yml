name: notarize
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to test
        required: true
      edition:
        description: Edition
        required: true
permissions:
  contents: read
jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64, mac-build]
    timeout-minutes: 60
    env:
      SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
      NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Fetch Pro module
        env:
          PRO_REPO_TOKEN: ${{ secrets.PRO_REPO_TOKEN }}
        run: |
          if [ -n "${PRO_REPO_TOKEN:-}" ]; then export GH_TOKEN="$PRO_REPO_TOKEN"; fi
          rm -rf pro
          gh repo clone "${{ vars.PRO_REPO || 'hippone-labs/assetboard-pro' }}" pro -- --depth=1 --quiet
      - name: Verify release script without publishing
        run: |
          export RELEASE_DIR="$RUNNER_TEMP/assetboard-diagnostic-$GITHUB_RUN_ID"
          zsh desktop/release.sh
      - name: Upload test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/assetboard-diagnostic-${{ github.run_id }}/notary*.json
          if-no-files-found: ignore
