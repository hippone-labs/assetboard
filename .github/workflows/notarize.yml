# Builds on GitHub-hosted macOS 26 with the pinned Xcode, signs with the Developer ID from a temporary keychain, notarizes with an
# App Store Connect API key (tools/ci-mac.sh; the secrets are in the release environment, which needs an approval), staples and
# uploads the zip as an artifact. It never creates a release or pushes a tag; publishing stays manual.
# Manual only (see release-app.yml).
name: notarize

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: main
        required: true

permissions:
  contents: read

concurrency:
  group: notarize
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
  # The same Xcode as build.yml.
  XCODE_VERSION: '26.6'

jobs:
  notarize:
    runs-on: macos-26
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # tools/ci-mac.sh as this workflow's own commit has it: inputs.ref may be a commit without it.
      - name: CI helper of this workflow's commit
        uses: actions/checkout@v4
        with:
          path: .ci
          sparse-checkout: tools/ci-mac.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Pro modules (private checkout beside the board)
        # The runner's own gh login reads the private repository; a PRO_REPO_TOKEN secret (a fine-grained token with contents: read
        # on it) is used instead when set, for a runner that is not logged in.
        env:
          PRO_REPO_TOKEN: ${{ secrets.PRO_REPO_TOKEN }}
        run: |
          if [ -n "${PRO_REPO_TOKEN:-}" ]; then export GH_TOKEN="$PRO_REPO_TOKEN"; fi
          rm -rf pro
          gh repo clone "${{ vars.PRO_REPO || 'hippone-labs/assetboard-pro' }}" pro -- --depth=1 --quiet
          test -f pro/web/pro.js

      - name: Select Xcode
        run: bash .ci/tools/ci-mac.sh xcode

      - name: Temporary signing keychain and notary profile
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: bash .ci/tools/ci-mac.sh keychain

      - name: Signing key and notary profile are usable
        run: |
          # Signs a throwaway copy of /usr/bin/true (no timestamp) so a keychain prompt fails fast instead of hanging.
          probe="$RUNNER_TEMP/sign-probe"; cp /usr/bin/true "$probe"
          perl -e 'alarm 60; exec @ARGV' codesign --force --timestamp=none --sign "$SIGNING_IDENTITY" "$probe" \
            || { echo "::error::codesign could not use the Developer ID key (locked keychain or access prompt)"; exit 1; }
          rm -f "$probe"
          perl -e 'alarm 60; exec @ARGV' xcrun notarytool history --keychain-profile "$NOTARY_PROFILE" --keychain "$NOTARY_KEYCHAIN" >/dev/null 2>&1 \
            || { echo "::error::notarytool cannot use the keychain profile $NOTARY_PROFILE"; exit 1; }
          echo "codesign: ok, notary profile: ok"

      - name: Build, sign, notarize, staple
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' desktop/Info.plist)"
          short="$(git rev-parse --short HEAD)"
          out="$RUNNER_TEMP/release"; mkdir -p "$out"
          zsh desktop/package.sh
          app=dist/Assetboard.app; name="Assetboard-macOS-arm64-$version.zip"
          codesign --verify --deep --strict --verbose=2 "$app"
          submit="$RUNNER_TEMP/submit.zip"
          ditto -c -k --keepParent "$app" "$submit"
          xcrun notarytool submit "$submit" --keychain-profile "$NOTARY_PROFILE" --keychain "$NOTARY_KEYCHAIN" --wait 2>&1 | tee "$out/notary.log"
          grep -q 'status: Accepted' "$out/notary.log" || { echo "::error::notarization not accepted"; exit 1; }
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl -a -vv "$app"
          rm -f "$submit"
          ditto -c -k --keepParent "$app" "$out/$name"
          sum="$(shasum -a 256 "$out/$name" | cut -d' ' -f1)"
          {
            echo "### Notarized build of \`$INPUT_REF\` ($short), version $version"
            echo
            echo "| zip | sha256 |"
            echo "|---|---|"
            echo "| $name | \`$sum\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the temporary keychain
        if: ${{ always() }}
        run: bash .ci/tools/ci-mac.sh cleanup

      - name: Upload notarized zips
        uses: actions/upload-artifact@v4
        with:
          name: notarized-${{ github.run_number }}
          path: ${{ runner.temp }}/release/
          retention-days: 30
