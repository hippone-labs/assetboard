# Builds, signs, notarizes and publishes on GitHub-hosted macOS 26 with the pinned Xcode. The job runs in the release environment
# (an approval, main and v* tags only), which holds the Developer ID p12, the App Store Connect API key and SITE_PUSH_TOKEN; the
# job puts the first two into a temporary keychain and deletes it at the end (tools/ci-mac.sh). The self-hosted Macs (mini-dev.yml,
# mbp-dev.yml, site-screenshots.yml) are attached to this public repository: no workflow that runs on them has a pull_request
# trigger, and a pull request from outside must not be approved to run workflows while they stay attached.
# Push an annotated vX.Y.Z tag on main, with the release notes as its message: a "## English" and a "## 中文"
# section, each a list of changes (tools/release_notes.py).
# By hand on a Mac with the Developer ID and a notary profile: SIGNING_IDENTITY, NOTARY_PROFILE and RELEASE_DIR set, zsh desktop/release.sh,
# then tools/publish-site-release.py.
name: release-app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes, a "## English" and a "## 中文" section (required for a manual run)
        required: true
        type: string

# contents: write is for the GitHub Release at the end; checkout keeps no credentials.
permissions:
  contents: write

concurrency:
  group: app-production-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# The signing identity is a secret (masked in the public logs); NOTARY_PROFILE and NOTARY_KEYCHAIN come from tools/ci-mac.sh.
env:
  SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
  # The same Xcode as build.yml.
  XCODE_VERSION: '26.6'

jobs:
  release:
    runs-on: macos-26
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pro modules (private checkout beside the board)
        # The runner's own gh login reads the private repository; a PRO_REPO_TOKEN secret (a fine-grained token with contents: read
        # on it) is used instead when set, for a runner that is not logged in.
        env:
          PRO_REPO_TOKEN: ${{ secrets.PRO_REPO_TOKEN }}
        run: |
          if [ -n "${PRO_REPO_TOKEN:-}" ]; then export GH_TOKEN="$PRO_REPO_TOKEN"; fi
          rm -rf pro
          gh repo clone "${{ vars.PRO_REPO || 'hippone-labs/assetboard-pro' }}" pro -- --depth=1 --quiet
          test -f pro/web/pro.js

      - name: Select Xcode
        run: bash tools/ci-mac.sh xcode

      - name: Temporary signing keychain and notary profile
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: bash tools/ci-mac.sh keychain

      - name: Prepare release and check publishing access
        env:
          MANUAL_NOTES: ${{ inputs.notes }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_IDENTITY" || { echo '::error::Set the SIGNING_IDENTITY repository secret'; exit 1; }
          test -n "$SITE_PUSH_TOKEN" || { echo '::error::Set SITE_PUSH_TOKEN in the release environment'; exit 1; }
          git merge-base --is-ancestor HEAD origin/main
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' desktop/Info.plist)"
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            test "$RELEASE_REF_NAME" = "v$version"
            # checkout may fetch the peeled commit into the tag ref. Restore the annotated tag object first.
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch origin "+refs/tags/$RELEASE_REF_NAME:refs/tags/$RELEASE_REF_NAME"
            test "$(git cat-file -t "refs/tags/$RELEASE_REF_NAME")" = tag
            test "$(git rev-parse "refs/tags/$RELEASE_REF_NAME^{commit}")" = "$(git rev-parse HEAD)"
            git cat-file tag "refs/tags/$RELEASE_REF_NAME" | sed '1,/^$/d' > "$RUNNER_TEMP/release-notes.md"
          else
            test "$RELEASE_REF" = refs/heads/main
            printf '%s\n' "$MANUAL_NOTES" > "$RUNNER_TEMP/release-notes.md"
          fi
          test -s "$RUNNER_TEMP/release-notes.md"
          # One section per language, for the GitHub Release, docs/releases and the version file; lines in turn are sorted too.
          python3 tools/release_notes.py "$RUNNER_TEMP/release-notes.md"
          # SITE_PUSH_TOKEN reads and pushes hippone/assetboard-site only; git takes it from this credential helper (the helper's shell
          # reads it from the environment), never from a URL or an argument.
          site_auth=(-c credential.helper= -c 'credential.helper=!f() { test "$1" = get || return 0; echo username=x-access-token; echo "password=$SITE_PUSH_TOKEN"; }; f')
          site="$(mktemp -d "$RUNNER_TEMP/assetboard-site.XXXXXX")"
          git "${site_auth[@]}" clone --depth=1 https://github.com/hippone/assetboard-site.git "$site"
          # A push dry run asks GitHub for the receive-pack refs, which needs write access: a token without it fails here, before the build.
          git -C "$site" "${site_auth[@]}" push --dry-run origin HEAD:main
          VERSION="$version" SITE_DIR="$site" python3 - <<'PY'
          import json, os
          from pathlib import Path
          old = json.loads((Path(os.environ['SITE_DIR']) / 'downloads/latest.json').read_text())['version']
          assert tuple(map(int, os.environ['VERSION'].split('.'))) > tuple(map(int, old.split('.'))), 'Bump the app version before publishing'
          PY
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "SITE_DIR=$site" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=$RUNNER_TEMP/app-release-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          mkdir -p "docs/releases"
          cp "$RUNNER_TEMP/release-notes.md" "docs/releases/$version.md"
          perl -e 'alarm 60; exec @ARGV' xcrun notarytool history --keychain-profile "$NOTARY_PROFILE" --keychain "$NOTARY_KEYCHAIN" >/dev/null

      - name: JavaScript tests
        run: node --test

      - name: Publishing tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Browser regression
        run: |
          # This step sets Playwright up itself, in the runner user's home.
          pw_home="$HOME/.cache/assetboard-ci/playwright-1.64.1"
          if [ ! -d "$pw_home/node_modules/playwright" ]; then
            npm install --prefix "$pw_home" --no-audit --no-fund playwright@1.64.1
          fi
          "$pw_home/node_modules/.bin/playwright" install chromium
          export NODE_PATH="$pw_home/node_modules"
          node tools/browser-tests.js --port 4330

      - name: Build, test, sign, notarize and package
        run: zsh desktop/release.sh

      - name: Write and verify SHA256SUMS.txt
        run: bash tools/write-sha256sums.sh "$RELEASE_DIR" "Assetboard-macOS-arm64-$VERSION.dmg" "Assetboard-macOS-arm64-$VERSION.zip"

      - name: Stage site release and check links
        run: |
          python3 tools/publish-site-release.py --site "$SITE_DIR" \
            --archive "$RELEASE_DIR/Assetboard-macOS-arm64-$VERSION.zip" \
            --disk-image "$RELEASE_DIR/Assetboard-macOS-arm64-$VERSION.dmg" \
            --version "$VERSION" --notes "$RUNNER_TEMP/release-notes.md"
          python3 "$SITE_DIR/tools/check_links.py" "$SITE_DIR"

      - name: Delete the temporary keychain
        if: ${{ always() }}
        run: bash tools/ci-mac.sh cleanup

      - name: Upload signed release and notarization receipt
        if: ${{ always() && env.RELEASE_DIR != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ github.run_number }}
          path: ${{ env.RELEASE_DIR }}
          retention-days: 30
          if-no-files-found: ignore

      - name: Publish site commit and wait for deployment
        # SITE_PUSH_TOKEN pushes the site commit (git) and watches its deployment (gh, Actions read on the site repository).
        env:
          SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          GH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          cd "$SITE_DIR"
          # The second language's pages, as tools/publish-site-release.py picks them: zh/ when the site has it, else en/.
          second=zh; [ -f zh/index.html ] || second=en
          git add index.html "$second/index.html" downloads/index.html "$second/downloads/index.html" downloads/latest.json "downloads/Assetboard-macOS-arm64-$VERSION.zip" "downloads/Assetboard-macOS-arm64-$VERSION.dmg"
          git diff --cached --check
          git -c user.name=lihaosong-code -c user.email=207678397+lihaosong-code@users.noreply.github.com commit -m "Release notarized Assetboard $VERSION"
          site_commit="$(git rev-parse HEAD)"
          git -c credential.helper= -c 'credential.helper=!f() { test "$1" = get || return 0; echo username=x-access-token; echo "password=$SITE_PUSH_TOKEN"; }; f' push origin HEAD:main
          run_id=''
          for attempt in {1..12}; do
            run_id="$(gh run list --repo hippone/assetboard-site --workflow deploy-site.yml --commit "$site_commit" --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo hippone/assetboard-site --exit-status --interval 10

      - name: Verify live update and archive checksum
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const response = await fetch(`https://assetboard.app/downloads/latest.json?release=${process.env.GITHUB_RUN_ID}`);
          assert.equal(response.status, 200);
          const manifest = await response.json();
          assert.equal(manifest.version, process.env.VERSION);
          assert.match(manifest.minimumSystemVersion, /^\d+(\.\d+){0,2}$/);
          const asset = manifest.assets.find(a => a.name === `Assetboard-macOS-arm64-${manifest.version}.zip`);
          assert.ok(asset);
          const zip = await fetch(asset.url);
          assert.equal(zip.status, 200);
          assert.equal(createHash('sha256').update(Buffer.from(await zip.arrayBuffer())).digest('hex'), asset.sha256);
          // The download buttons offer the disk image, byte for byte the one this run notarized.
          const { readFileSync } = await import('node:fs');
          const image = `Assetboard-macOS-arm64-${manifest.version}.dmg`;
          // English at the root, Chinese under /zh/ (before that move, English under /en/: the site answers 404 for /zh/).
          const second = (await fetch(`https://assetboard.app/zh/?release=${process.env.GITHUB_RUN_ID}`)).ok ? 'zh' : 'en';
          for (const page of ['https://assetboard.app/', `https://assetboard.app/${second}/`]) {
            const html = await (await fetch(`${page}?release=${process.env.GITHUB_RUN_ID}`)).text();
            assert.ok(html.includes(`/downloads/${image}`), `${page} links ${image}`);
          }
          const dmg = await fetch(`https://assetboard.app/downloads/${image}`);
          assert.equal(dmg.status, 200);
          const local = readFileSync(`${process.env.RELEASE_DIR}/${image}`);
          assert.equal(createHash('sha256').update(Buffer.from(await dmg.arrayBuffer())).digest('hex'), createHash('sha256').update(local).digest('hex'));
          console.log(`Published ${manifest.version}: update zip and disk image checksums verified`);
          JS
          echo "Published Assetboard $VERSION at https://assetboard.app/downloads/" >> "$GITHUB_STEP_SUMMARY"

      - name: GitHub Release
        # The run's own token: a tag it creates (a manual run has none yet) does not start this workflow again.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/github-release-notes.md"
          {
            cat "$RUNNER_TEMP/release-notes.md"
            printf '\n## SHA-256\n\n```\n'
            cat "$RELEASE_DIR/SHA256SUMS.txt"
            printf '```\n'
          } > "$notes"
          url="$(tools/github-release.sh "$VERSION" "$notes" \
            "$RELEASE_DIR/Assetboard-macOS-arm64-$VERSION.dmg" "$RELEASE_DIR/Assetboard-macOS-arm64-$VERSION.zip" \
            "$RELEASE_DIR/SHA256SUMS.txt" | tail -1)"
          echo "GitHub Release: $url" >> "$GITHUB_STEP_SUMMARY"

  # The Mac mini's own developer build follows each release; its own workflow, so it can also run by hand (mini-dev.yml).
  # The MacBook Pro install is mbp-dev.yml, started after this workflow finishes. It is not a job here: an offline Mac
  # would keep group app-production-release occupied, and timeout-minutes does not limit that wait.
  mini-dev:
    name: Update Mini dev build
    needs: release
    uses: ./.github/workflows/mini-dev.yml
    with:
      ref: ${{ github.sha }}
    secrets:
      PRO_REPO_TOKEN: ${{ secrets.PRO_REPO_TOKEN }}
